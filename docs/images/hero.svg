<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">AI Social Media Agent</title>
  <desc id="desc">Fluxo visual do pedido à publicação, com inteligência artificial, automação e governança.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.55" stop-color="#18181b"/>
      <stop offset="1" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#a1a1aa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1600" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1325" cy="105" r="180" fill="#ffffff" opacity="0.035"/>
  <circle cx="1410" cy="500" r="260" fill="#ffffff" opacity="0.025"/>
  <path d="M0 510 C340 420 500 610 820 500 S1290 390 1600 475" fill="none" stroke="#ffffff" opacity="0.06" stroke-width="2"/>
  <rect x="92" y="88" width="88" height="8" rx="4" fill="url(#accent)"/>
  <text x="92" y="172" fill="#fafafa" font-family="Arial, sans-serif" font-size="72" font-weight="700">AI Social Media Agent</text>
  <text x="94" y="226" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="25" letter-spacing="2">AUTOMAÇÃO MULTI-CLIENTE • CONTEÚDO • DESIGN • PUBLICAÇÃO</text>
  <text x="94" y="318" fill="#e4e4e7" font-family="Arial, sans-serif" font-size="34">Do pedido à publicação.</text>
  <text x="94" y="365" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="24">IA estruturada, identidade de marca, aprovação explícita</text>
  <text x="94" y="402" fill="#a1a1aa" font-family="Arial, sans-serif" font-size="24">e distribuição social com rastreabilidade ponta a ponta.</text>
  <g transform="translate(92 482)">
    <rect width="170" height="52" rx="26" fill="#fafafa"/>
    <text x="85" y="34" text-anchor="middle" fill="#09090b" font-family="Arial, sans-serif" font-size="18" font-weight="700">BRIEFING</text>
    <path d="M188 26h50" stroke="#71717a" stroke-width="2"/>
    <path d="m231 19 8 7-8 7" fill="none" stroke="#71717a" stroke-width="2"/>
    <rect x="256" width="170" height="52" rx="26" fill="#27272a" stroke="#52525b"/>
    <text x="341" y="34" text-anchor="middle" fill="#fafafa" font-family="Arial, sans-serif" font-size="18" font-weight="700">ARTE</text>
    <path d="M444 26h50" stroke="#71717a" stroke-width="2"/>
    <path d="m487 19 8 7-8 7" fill="none" stroke="#71717a" stroke-width="2"/>
    <rect x="512" width="180" height="52" rx="26" fill="#27272a" stroke="#52525b"/>
    <text x="602" y="34" text-anchor="middle" fill="#fafafa" font-family="Arial, sans-serif" font-size="18" font-weight="700">APROVAÇÃO</text>
    <path d="M710 26h50" stroke="#71717a" stroke-width="2"/>
    <path d="m753 19 8 7-8 7" fill="none" stroke="#71717a" stroke-width="2"/>
    <rect x="778" width="190" height="52" rx="26" fill="#fafafa"/>
    <text x="873" y="34" text-anchor="middle" fill="#09090b" font-family="Arial, sans-serif" font-size="18" font-weight="700">PUBLICAÇÃO</text>
  </g>
  <g transform="translate(1260 240)">
    <circle cx="90" cy="90" r="88" fill="#ffffff" opacity="0.05" filter="url(#glow)"/>
    <circle cx="90" cy="90" r="78" fill="#18181b" stroke="#71717a" stroke-width="2"/>
    <path d="M52 91h76M91 52v76" stroke="#fafafa" stroke-width="8" stroke-linecap="round"/>
    <circle cx="91" cy="91" r="24" fill="#18181b" stroke="#fafafa" stroke-width="7"/>
